exclusions:
  - id: AUDIT-META-TESTS-001
    finding: "test_every_validated_requirement_is_tested_or_excluded and test_every_test_sheet_is_complete_and_names_a_requirement in tests/test_requirements.py have no @pytest.mark.req tag (audit 2026-11-24, finding 5)"
    justification: "Meta tests of the RBD process (requirement coverage, bench sheet structure and tags), not of a product requirement: the rule is the RBD plugin's, a requirement for it would duplicate the process. They are kept because they run on every commit and in CI, where the audit runs on demand."
    date: 2026-11-24
  - id: AUDIT-PRE-RBD-IMPL-001
    finding: "PLAT-POWER-CHARGE-001, PLAT-POWER-GATE-001, PLAT-POWER-HOTPLUG-001, PLAT-POWER-REG-002, PLAT-POWER-REG-003, TECH-POWER-CELL-001, TECH-POWER-DIST-001, TECH-POWER-PROTECT-002, TECH-POWER-REG-001, TECH-POWER-GROUND-001: test commits without an implementation commit (audit 2026-11-24, finding 6)"
    justification: "The design predates RBD: the schematic generator of the initial snapshot b337a5a (2026-10-28, before the RBD init d77f7d7) already holds these parts and nets (SMAJ5 TVS, PS/SYNC to GND, 220 uF on 3V3, Q5, the polyfuses); the requirements and their tests were written afterwards to pin the existing design. PLAT-POWER-CHARGE-001 (J1 drawn in the schematic) was implemented in the published commits c829b75 / 8f59892 under fix(ID):. Not fixable without rewriting published history; new changes use feat/tech(ID):."
    date: 2026-11-24
  - id: AUDIT-NO-TEST-COMMIT-001
    finding: "TECH-BUILD-DOCS-001, TECH-BUILD-NAME-001, TECH-HARNESS-BOARDS-001, CONF-POWER-THRESH-001, FUNC-POWER-MONITOR-003: implementation commits without a test(ID): commit (audit 2026-11-24, finding 7)"
    justification: "TECH-BUILD-DOCS-001, TECH-BUILD-NAME-001 and TECH-HARNESS-BOARDS-001 have tagged pytests, committed in their published req(ID): commits (6353de8, cc89181, 757b539) instead of a test(ID): commit. The conf / feat commits of CONF-POWER-THRESH-001 (438b5d3) and FUNC-POWER-MONITOR-003 (d7cc4b5) only document the thresholds in design_notes.md; their tests are firmware tests, still pending and tracked by the coverage check (finding 2). Not fixable without rewriting published history."
    date: 2026-11-24
  - id: AUDIT-REQ-FILE-COMMITS-001
    finding: "Commits 9580f04 (docs:), 2cf9af2 (refactor:), ef88d4b (feat(ID):) and cc1ba2b (test(ID):) changed requirements/*.md without a req: or plan: commit (audit 2026-11-24, finding 10)"
    justification: "Published history. 9580f04 only adds the blank lines between fields, 2cf9af2 only follows the folder split in the paths, ef88d4b only follows the SPIT rename in file names. cc1ba2b changes the content of one requirement: the BME280 board leaves the list of boards whose LED is removed, since it has none; a factual correction, kept, that should have been a req(ID): commit. A requirement file now changes only through req(ID): or plan: commits (.rbd/plan-files.yml accepted_prefixes)."
    date: 2026-11-24
  - id: AUDIT-NO-ARCHITECTURE-001
    finding: "docs/architecture.md does not exist; T5 (Requirement → Component traceability, dependency injection map) and C5 cannot run (audit 2026-11-24, finding 11)"
    justification: "Main holds no firmware yet (software/ has only the Pro Micro PIR bench test): there are no software components or injected dependencies to map. The hardware design (parts, placement, signals, wiring) lives in hardware/design_notes.md, its owner under TECH-BUILD-DOCS-001; an architecture.md listing it again would duplicate it. Temporary: docs/architecture.md is written with the first S3 firmware merged to main, and this exclusion is then removed."
    date: 2026-11-24
  - id: COVERAGE-FIRMWARE-001
    finding: "CONF-POWER-THRESH-001, FUNC-POWER-CUTOFF-001, FUNC-POWER-CUTOFF-002, FUNC-POWER-DETECT-001, FUNC-POWER-DETECT-002, FUNC-POWER-MONITOR-001, FUNC-POWER-MONITOR-002, FUNC-POWER-MONITOR-003, FUNC-POWER-VSENSE-001, PLAT-POWER-SLEEP-002, TECH-POWER-BACKFEED-001: validated, no tagged test (audit 2026-11-24, finding 2)"
    justification: "Firmware behaviour, verified by Unity tests (native, or on target with the instruments the requirement names); main holds no S3 firmware yet. Not a waiver: tests/test_requirements.py only warns for these requirements while software/ has no Unity test, and requires their tests from the first one on."
    date: 2026-11-24
